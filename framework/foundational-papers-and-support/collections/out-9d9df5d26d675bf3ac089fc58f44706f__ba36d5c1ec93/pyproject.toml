[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mk43-brane"
version = "2.3.2"
description = "MK43 BRANE full modular runtime"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "Proprietary research reference implementation"}

[project.scripts]
mk43-brane = "mk43_brane.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
